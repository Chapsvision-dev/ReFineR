  #     - nbins: 12
  #       cell_size: 16
  #       cells_per_block: 4

  #     - nbins: 12
  #       cell_size: 8
  #       cells_per_block: 4

  #     - nbins: 12
  #       cell_size: 4
  #       cells_per_block: 4

  # ma:
  #   channels: 
  #     - comp: [g, g]
  #       weight: 1
  #   weight: 1
      
  # photo:
  #   channels:     
  #     - comp: [g, g]
  #       weight: 1      
  #   weight: 1

optim: 
  niter: [2e-5, 50, 500]
  lr: 0.0002
  
saver_file: 
  path: ${out_path}
  pc_channel: ${viz_chan:${renderer.render_channels}}
  modules: 
  # Available modules: imgs, cams, pc, fused, graphs, csvs, fused_iter
    - imgs
    # - cams
    - fused
    # - graphs
    # - csvs
    - fused_iter
    - imgs_init
    - video

saver_rerun: 
  path: ${out_path}
  pc_channel: ${viz_chan:${renderer.render_channels}}
  spawn: True
  modules: 
    - imgs
    - cams
    - pc
    - fused
    - fused_iter
    - match_pairs
    - imgs_init
    - dist_mask
