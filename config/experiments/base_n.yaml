
camera:
  extr_grad: True
  intr_grad: False
  clip_plane: ${get_clip_plane:${data.pc_view_filter}}
  ndc_ranges: [-1, 1, 1, -1, 0, 1]
  viewport: [0, -1, -1, 0, 0, 1]
  intr_model: FXFY

data:
  set: ${set}
  scene: ${scene}

  pc_channels: ${filter_synth:${unique:${add_xyz:${extract_0:${loss}}}}}
  pc_subsample_factor: 1
  pc_dynamic_scale: True # Tweak
  pc_view_filter: [20, 1, 100] # Tweak
  pc_normalize_intensity: True
  pc_lod_filter: -1

  img_channels: ${unique:${extract_1:${loss}}}
  img_min_size: -1
  img_center_crop: [0, 0]
  equalize_intensity: False # Tweak
  absolute_normals: True # Tweak

  seed: 92 # Tweak

  pert_init: # Tweak
    p: 10
    f: 0
    c: 0

matchAnything_init: True

gs:
  point_size: 0.5
  opacity: 0.2
  mip_size: 2

renderer: 
  render_type: GS
  render_channels: ${unique:${extract_0:${loss}}}

logger:
  log_freq: 5
  log_to_file: True
  log_to_console: True

loss: # Tweak
  grad:
    channels: 
      - comp: [nx, g]
        weight: 1
      - comp: [ny, g]
        weight: 1      
      - comp: [nz, g]
        weight: 1

    weight: 1

optim: 
  niter: [2e-5, 50, 500]
  lr: 0.0002
  
saver_file: 
  path: ${out_path}
  pc_channel: ${viz_chan:${renderer.render_channels}}
  modules: 
    - fused