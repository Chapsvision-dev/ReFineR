data:
  set: ${set}
  scene: ${scene}

  pc_channels: ${filter_synth:${unique:${add_xyz:${extract_0:${loss}}}}}
  pc_subsample_factor: 1.
  pc_dynamic_scale: True # Tweak
  pc_view_filter: [50, 0.01, 100] # Tweak
  pc_normalize_intensity: True
  pc_lod_filter: -1
  img_channels: ${unique:${extract_1:${loss}}}
  img_min_size: 1024
  img_center_crop: [0, 0]
  equalize_intensity: True # Tweak
  absolute_normals: True # Tweak

  pert_init: null
  cam_precomp: False
  seed: 92 # Tweak
matchAnything_init: False
matchAnything_init_gs: True
